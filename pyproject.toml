[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pylovegmod-sdk"
version = "0.0.1a1"
description = "Project, build and dependency manager for the PLG ecosystem, orchestrating tools"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
authors = [{ name = "Cain" }]
dependencies = ["colorama", "pylovegmod-shared"]

[project.scripts]
plg-sdk = "plg_sdk.__main__:main"

[project.urls]
homepage = "https://github.com/py-love-gmod/plg-sdk"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
plg_sdk = ["resource/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
